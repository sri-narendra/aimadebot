name: Keep Alive - flashoot-chatbot-backend

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping flashoot-chatbot-backend
        run: curl -s -o /dev/null -w "%{http_code}" https://flashoot-chatbot-backend.onrender.com