<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashoot AI Assistant</title>
<style>
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #1a1d27;
  --bg-tertiary: #252836;
  --bg-card: #1e2030;
  --border-color: #2e3144;
  --text-primary: #e8e9f0;
  --text-secondary: #9598b0;
  --text-muted: #6b6f8a;
  --accent: #6366f1;
  --accent-hover: #5558e6;
  --accent-glow: rgba(99,102,241,0.25);
  --success: #34d399;
  --error: #f87171;
  --warning: #fbbf24;
  --user-bubble: #6366f1;
  --bot-bubble: #1e2030;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

.chat-toggle {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: var(--radius-full);
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 26px;
  box-shadow: 0 4px 20px var(--accent-glow);
  z-index: 9999;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
}
.chat-toggle:hover { transform: scale(1.08); background: var(--accent-hover); }
.chat-toggle svg { width: 28px; height: 28px; fill: currentColor; }

.chat-container {
  position: fixed;
  bottom: 96px;
  right: 24px;
  width: 380px;
  height: 580px;
  max-height: calc(100vh - 140px);
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: none;
  flex-direction: column;
  z-index: 9998;
  overflow: hidden;
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.chat-container.open { display: flex; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.chat-header {
  padding: 16px 20px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.chat-header-info { display: flex; align-items: center; gap: 12px; }
.chat-header-avatar {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px;
}
.chat-header-text h3 { font-size: 14px; font-weight: 600; }
.chat-header-text p { font-size: 11px; color: var(--text-muted); }
.status-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle;
}
.status-dot.connected { background: var(--success); }
.status-dot.disconnected { background: var(--error); }
.status-dot.checking { background: var(--warning); animation: pulse 1.5s infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.chat-header-actions { display: flex; gap: 4px; }
.chat-header-btn {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 6px; border-radius: var(--radius-sm);
  transition: all 0.2s; display: flex; align-items: center;
}
.chat-header-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
.chat-header-btn svg { width: 18px; height: 18px; fill: currentColor; }

.chat-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

.welcome-message {
  text-align: center; padding: 24px 16px; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.welcome-message svg { width: 48px; height: 48px; opacity: 0.4; margin-bottom: 4px; }
.welcome-message h3 { color: var(--text-secondary); font-size: 15px; }
.welcome-message p { font-size: 12px; line-height: 1.5; max-width: 280px; }

.suggested-prompts {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin-top: 8px;
}
.suggested-prompt {
  padding: 6px 14px; border-radius: var(--radius-full);
  background: var(--bg-tertiary); border: 1px solid var(--border-color);
  color: var(--text-secondary); cursor: pointer; font-size: 11px;
  transition: all 0.2s;
}
.suggested-prompt:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

.message {
  display: flex; gap: 10px; max-width: 88%; animation: msgIn 0.25s ease-out;
}
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.bot { align-self: flex-start; }

@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.message-avatar {
  width: 28px; height: 28px; border-radius: var(--radius-full);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
.message.user .message-avatar { background: var(--accent); color: #fff; }
.message.bot .message-avatar { background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-secondary); }

.message-content {
  padding: 10px 14px; border-radius: var(--radius);
  line-height: 1.55; font-size: 13px; word-wrap: break-word;
}
.message.user .message-content {
  background: var(--accent); color: #fff;
  border-bottom-right-radius: 4px;
}
.message.bot .message-content {
  background: var(--bot-bubble); border: 1px solid var(--border-color);
  color: var(--text-primary); border-bottom-left-radius: 4px;
}

.message-content p { margin-bottom: 8px; }
.message-content p:last-child { margin-bottom: 0; }
.message-content strong { font-weight: 600; }
.message-content ul, .message-content ol { padding-left: 18px; margin: 6px 0; }
.message-content li { margin-bottom: 4px; }
.message-content code {
  background: rgba(255,255,255,0.08); padding: 2px 6px;
  border-radius: 4px; font-size: 12px; font-family: 'JetBrains Mono', monospace;
}
.message-content pre {
  background: var(--bg-primary); padding: 12px; border-radius: var(--radius-sm);
  overflow-x: auto; margin: 8px 0; border: 1px solid var(--border-color);
}
.message-content pre code { background: none; padding: 0; }

.citations {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color);
  display: flex; flex-wrap: wrap; gap: 4px;
}
.citation {
  padding: 3px 10px; border-radius: var(--radius-full);
  background: var(--accent-glow); border: 1px solid rgba(99,102,241,0.3);
  color: var(--accent); font-size: 10px; cursor: pointer; text-decoration: none;
  transition: all 0.2s;
}
.citation:hover { background: var(--accent); color: #fff; }

.typing-indicator {
  display: flex; gap: 4px; padding: 8px 0; align-items: center;
}
.typing-indicator span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted); animation: typingBounce 1.4s infinite ease-in-out;
}
.typing-indicator span:nth-child(1) { animation-delay: 0s; }
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

.error-message {
  color: var(--error); font-size: 12px; padding: 8px 0;
}

.input-area {
  padding: 12px 16px; border-top: 1px solid var(--border-color);
  background: var(--bg-tertiary); flex-shrink: 0;
}
.input-row {
  display: flex; gap: 8px; align-items: flex-end;
}
.chat-input {
  flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); padding: 10px 14px;
  color: var(--text-primary); font-size: 13px; font-family: var(--font);
  outline: none; resize: none; max-height: 120px; line-height: 1.4;
  transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--text-muted); }

.send-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; fill: currentColor; }

.retry-btn {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-size: 11px; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px;
}
.retry-btn:hover { text-decoration: underline; }

.feedback-btns {
  display: flex; gap: 4px; margin-top: 6px; opacity: 0.6;
}
.feedback-btn {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  padding: 2px 6px; border-radius: 4px; font-size: 12px; transition: all 0.2s;
}
.feedback-btn:hover { color: var(--text-primary); background: var(--bg-tertiary); }

.loading-overlay {
  position: absolute; inset: 0; background: rgba(15,17,23,0.8);
  display: none; align-items: center; justify-content: center; z-index: 10;
  border-radius: var(--radius);
}
.loading-overlay.active { display: flex; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Demo page content for GitHub Pages */
.demo-content {
  max-width: 720px; margin: 0 auto; padding: 60px 24px;
  text-align: center;
}
.demo-content h1 { font-size: 32px; margin-bottom: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.demo-content p { color: var(--text-secondary); font-size: 16px; line-height: 1.7; max-width: 520px; margin: 0 auto 8px; }
.demo-content .flashoot-link { display: inline-block; margin-top: 16px; padding: 10px 24px; background: var(--accent); color: #fff; text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; transition: background 0.2s; }
.demo-content .flashoot-link:hover { background: var(--accent-hover); }

@media (max-width: 480px) {
  .chat-container { width: calc(100vw - 24px); right: 12px; bottom: 88px; height: calc(100vh - 120px); max-height: none; }
  .chat-toggle { bottom: 16px; right: 16px; width: 54px; height: 54px; font-size: 22px; }
  .demo-content { padding: 40px 16px; }
  .demo-content h1 { font-size: 24px; }
}
</style>
</head>
<body>

<div class="demo-content" id="demoContent">
  <h1>Flashoot AI Assistant</h1>
  <p>Ask anything about Flashoot — products, services, pricing, and more. Powered by RAG with real-time website content retrieval.</p>
  <a class="flashoot-link" href="https://www.flashoot.com" target="_blank" rel="noopener">Visit Flashoot →</a>
</div>

<button class="chat-toggle" id="chatToggle" aria-label="Toggle chat">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
</button>

<div class="chat-container" id="chatContainer">
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-header-avatar">F</div>
      <div class="chat-header-text">
        <h3>Flashoot Assistant</h3>
        <p>
          <span class="status-dot checking" id="statusDot"></span>
          <span id="statusText">Connecting...</span>
        </p>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="chat-header-btn" id="clearChatBtn" title="Clear chat">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <button class="chat-header-btn" id="closeChatBtn" title="Close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="welcome-message" id="welcomeMsg">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
      <h3>How can I help you?</h3>
      <p>Ask me anything about Flashoot — products, services, and more.</p>
      <div class="suggested-prompts" id="suggestedPrompts">
        <button class="suggested-prompt" data-prompt="What does Flashoot do?">What does Flashoot do?</button>
        <button class="suggested-prompt" data-prompt="What services does Flashoot offer?">Services offered</button>
        <button class="suggested-prompt" data-prompt="How can I contact Flashoot?">How to contact?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Ask about Flashoot..." maxlength="2000"></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://flashoot-chatbot.onrender.com',
  CONNECTION_CHECK_INTERVAL: 30000,
  MAX_RETRIES: 3,
  RETRY_DELAY: 1000,
};

let state = {
  isOpen: false,
  isConnected: false,
  isStreaming: false,
  conversationId: null,
  retryCount: 0,
  currentBotMessage: null,
};

function generateId() {
  return 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

if (!localStorage.getItem('flashoot_conversation_id')) {
  localStorage.setItem('flashoot_conversation_id', generateId());
}
state.conversationId = localStorage.getItem('flashoot_conversation_id');

const els = {
  toggle: document.getElementById('chatToggle'),
  container: document.getElementById('chatContainer'),
  messages: document.getElementById('chatMessages'),
  input: document.getElementById('chatInput'),
  sendBtn: document.getElementById('sendBtn'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  welcome: document.getElementById('welcomeMsg'),
  loading: document.getElementById('loadingOverlay'),
  clearBtn: document.getElementById('clearChatBtn'),
  closeBtn: document.getElementById('closeChatBtn'),
  suggestions: document.getElementById('suggestedPrompts'),
};

// Markdown parser
function parseMarkdown(text) {
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  text = text.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\n{2,}/g, '</p><p>');
  text = '<p>' + text + '</p>';
  text = text.replace(/<p><\/p>/g, '');
  text = text.replace(/<\/ul><p>/g, '</ul><p>');
  text = text.replace(/<p><ul>/g, '<ul>');
  return text;
}

function scrollToBottom() {
  const el = els.messages;
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// Connection check
async function checkConnection() {
  els.statusDot.className = 'status-dot checking';
  els.statusText.textContent = 'Checking...';
  try {
    const resp = await fetch(`${CONFIG.API_URL}/health`, { signal: AbortSignal.timeout(8000) });
    if (resp.ok) {
      state.isConnected = true;
      els.statusDot.className = 'status-dot connected';
      els.statusText.textContent = 'Online';
      return true;
    }
    throw new Error('Not OK');
  } catch {
    state.isConnected = false;
    els.statusDot.className = 'status-dot disconnected';
    els.statusText.textContent = 'Offline';
    return false;
  }
}

// Auto-input resize
els.input.addEventListener('input', () => {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 120) + 'px';
  els.sendBtn.disabled = !els.input.value.trim();
});

els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

els.sendBtn.addEventListener('click', sendMessage);

// Suggested prompts
els.suggestions.addEventListener('click', (e) => {
  const btn = e.target.closest('.suggested-prompt');
  if (btn) {
    els.input.value = btn.dataset.prompt;
    els.input.dispatchEvent(new Event('input'));
    sendMessage();
  }
});

// Clear chat
els.clearBtn.addEventListener('click', () => {
  const msgs = els.messages.querySelectorAll('.message');
  msgs.forEach(m => m.remove());
  els.welcome.style.display = 'flex';
  state.conversationId = generateId();
  localStorage.setItem('flashoot_conversation_id', state.conversationId);
  checkConnection();
});

// Toggle chat
els.toggle.addEventListener('click', () => {
  state.isOpen = !state.isOpen;
  els.container.classList.toggle('open', state.isOpen);
  els.toggle.innerHTML = state.isOpen
    ? '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>';
  if (state.isOpen) {
    scrollToBottom();
    els.input.focus();
  }
});

els.closeBtn.addEventListener('click', () => {
  state.isOpen = false;
  els.container.classList.remove('open');
  els.toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>';
});

// Show typing indicator
function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="message-avatar">F</div><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  els.messages.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function addMessage(role, content, citations) {
  els.welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatar = role === 'user' ? 'You' : 'F';
  let html = `<div class="message-avatar">${avatar}</div><div class="message-content">${role === 'bot' ? '' : ''}`;
  if (role === 'user') {
    html += escHtml(content);
  }
  html += `</div>`;
  div.innerHTML = html;
  if (role === 'user') {
    div.querySelector('.message-content').textContent = content;
  }
  els.messages.appendChild(div);
  scrollToBottom();
  return div;
}

function addBotMessage() {
  els.welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'message bot';
  div.innerHTML = `<div class="message-avatar">F</div><div class="message-content" id="botMsgContent"></div>`;
  els.messages.appendChild(div);
  scrollToBottom();
  return div.querySelector('.message-content');
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderCitations(citations) {
  if (!citations || citations.length === 0) return '';
  let html = '<div class="citations">';
  citations.forEach(c => {
    html += `<a class="citation" href="${escHtml(c.url)}" target="_blank" rel="noopener">${escHtml(c.title || c.url)}</a>`;
  });
  html += '</div>';
  return html;
}

function addFeedbackBtns(container) {
  const div = document.createElement('div');
  div.className = 'feedback-btns';
  div.innerHTML = '<button class="feedback-btn" data-action="helpful">👍</button><button class="feedback-btn" data-action="not-helpful">👎</button>';
  container.appendChild(div);
}

// Streaming send
async function sendMessage() {
  const text = els.input.value.trim();
  if (!text || state.isStreaming) return;

  els.input.value = '';
  els.input.style.height = 'auto';
  els.sendBtn.disabled = true;
  state.isStreaming = true;

  addMessage('user', text);
  hideTyping();
  showTyping();

  let retries = 0;
  let success = false;

  while (retries <= CONFIG.MAX_RETRIES && !success) {
    try {
      hideTyping();
      const contentEl = addBotMessage();
      state.currentBotMessage = contentEl;
      let fullContent = '';

      const resp = await fetch(`${CONFIG.API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversation_id: state.conversationId }),
        signal: AbortSignal.timeout(30000),
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        throw new Error(errData.detail || `Server error: ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6).trim();
            if (data === '[DONE]') continue;
            try {
              const parsed = JSON.parse(data);
              if (parsed.type === 'content') {
                fullContent += parsed.content;
                contentEl.innerHTML = parseMarkdown(fullContent);
                scrollToBottom();
              } else if (parsed.type === 'citations') {
                contentEl.innerHTML += renderCitations(parsed.citations);
                addFeedbackBtns(contentEl);
                scrollToBottom();
              } else if (parsed.type === 'error') {
                contentEl.innerHTML = `<span class="error-message">${escHtml(parsed.content)}</span>`;
                scrollToBottom();
              } else if (parsed.type === 'status') {
                // status updates
              }
            } catch { /* skip parse errors */ }
          }
        }
      }

      success = true;
      state.retryCount = 0;

    } catch (err) {
      retries++;
      hideTyping();
      if (retries <= CONFIG.MAX_RETRIES) {
        const retryMsg = addBotMessage();
        retryMsg.innerHTML = `<span class="error-message">Connection issue. Retrying (${retries}/${CONFIG.MAX_RETRIES})...</span>`;
        await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY * retries));
        if (state.currentBotMessage) state.currentBotMessage.remove();
      } else {
        const errMsg = addBotMessage();
        errMsg.innerHTML = `<span class="error-message">Unable to reach the assistant. The backend may be starting up. <button class="retry-btn" onclick="sendMessage()">Retry</button></span>`;
        scrollToBottom();
      }
    }
  }

  showTyping();
  hideTyping();
  state.isStreaming = false;
  els.sendBtn.disabled = false;
  els.input.focus();
}

// Connection check interval
checkConnection();
setInterval(checkConnection, CONFIG.CONNECTION_CHECK_INTERVAL);

console.log('Flashoot AI Chatbot loaded.');
console.log(`Backend: ${CONFIG.API_URL}`);
</script>
